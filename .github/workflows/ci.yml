# The tests, the typecheck, and the example's build check, on the two Node
# lines the package supports. The remote test skips without
# SOLARSQL_REMOTE_URL, so this workflow needs no secret.
name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          - { node: "24", os: macos-latest }
          - { node: "24", os: windows-latest }
    # Windows has not run this workflow yet: the lock file's link() and its
    # path joins are untested there. The first green Windows run removes
    # this line.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:all
      - run: node src/build/cli.ts build --check example/solarsql.config.ts
