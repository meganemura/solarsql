# The tests, the typecheck, the module-boundary check, the example's build
# check, and the nukadoko scenario, on the two Node lines the package supports and on each line's floor
# (24.20.0 and 26.7.0, ubuntu only, ADR 0129), and the node() adapter's tests
# on the Bun release node() accepts (ubuntu only, ADR 0147). The remote test skips without
# SOLARSQL_REMOTE_URL, so this workflow needs no secret.
name: ci
on:
  push:
    branches: [main, queue]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26", "24.20.0", "26.7.0"]
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          - { node: "24", os: macos-latest }
          - { node: "24", os: windows-latest }
          - { node: "24.20.0", os: macos-latest }
          - { node: "24.20.0", os: windows-latest }
          - { node: "26.7.0", os: macos-latest }
          - { node: "26.7.0", os: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run archstrict
      - run: npm run test:all
      - run: node src/build/cli.ts build --check example/solarsql.config.ts
      # The scenario starts npm through spawn, and Node refuses to spawn
      # npm.cmd without a shell. The packed install it checks does not
      # depend on the OS; the pack test covers Windows.
      - run: npm run test:scenarios
        if: runner.os != 'Windows'
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"
      - run: npm ci
      - run: npm run test:bun
