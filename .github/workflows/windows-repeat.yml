# Temporary: run the D1 OR ROLLBACK test 20 times on Windows. Remove before merge.
name: windows-repeat
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  repeat:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - shell: bash
        run: |
          for i in $(seq 1 20); do
            echo "=== run $i"
            npx vitest run --project miniflare test/miniflare/or-rollback.test.ts || { echo "FAILED at run $i"; exit 1; }
          done
